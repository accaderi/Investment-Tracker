<style>

.cards{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}

.num{text-align:right;font-variant-numeric:tabular-nums}tbody tr.click{cursor:pointer}tbody tr:hover td{background:var(--head)}
table.fx{table-layout:fixed}table.fx>thead>tr>th,table.fx>tbody>tr>td{overflow:hidden;text-overflow:ellipsis}
table.fx>thead>tr>th:first-child,table.fx>tbody>tr>td:first-child{position:sticky;left:0;box-shadow:1px 0 0 var(--line)}table.fx>tbody>tr>td:first-child{background:var(--panel);z-index:2}table.fx>thead>tr>th:first-child{z-index:4}

.colmenu{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px}.colmenu label{display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer}

.pos{color:var(--pos)}.neg{color:var(--neg)}.na{color:var(--muted)}
.badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:600;margin-left:5px;color:#fff;cursor:help}

.modal .foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--line)}
.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.field input,.field select{width:100%}
.field textarea{width:100%;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 9px;resize:vertical;min-height:64px;line-height:1.4}.field textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.noteft{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
.nb{border:0;background:none;cursor:pointer;color:var(--muted);padding:2px 3px;margin-left:4px;vertical-align:-3px;line-height:1;border-radius:4px;flex:none}

.nb:hover{color:var(--accent);background:var(--head)}.nb.has{color:var(--accent)}.nb.has svg{fill:currentColor;fill-opacity:.2}
td .nb:not(.has){opacity:0}tr:hover .nb:not(.has),td .nb:focus-visible{opacity:1}
@media (hover:none){td .nb:not(.has){opacity:.55}}
td .notetxt{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}td .notetxt:hover{color:var(--accent)}
.notebox{background:var(--head);border-left:3px solid var(--accent);border-radius:6px;padding:8px 10px;margin:0 0 12px;font-size:13px}
.notebox b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin-bottom:2px}
.notebox div{white-space:pre-wrap;max-height:110px;overflow:auto;overflow-wrap:anywhere}
.also{display:block;max-width:100%;border:0;background:none;padding:0;margin:1px 0 0;font:inherit;font-size:11px;line-height:1.3;color:var(--accent);text-align:left;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.also:hover,.also:focus-visible{text-decoration:underline}
.fbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 10px;padding:6px 8px 6px 12px;background:var(--head);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;font-size:13px}.fbar span{min-width:0;overflow-wrap:anywhere}.fbar .btn{padding:3px 12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ac{position:relative}.ac-list{position:absolute;left:0;right:0;top:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;z-index:5;max-height:240px;overflow:auto;box-shadow:var(--shadow)}
.ac-item.online{color:var(--accent);border-top:1px solid var(--line)}.ac-item.muted{cursor:default}
.ac-item{padding:7px 10px;cursor:pointer}.ac-item:hover,.ac-item.sel{background:var(--head)}.ac-item .t{font-weight:600}
.resolve{background:var(--head);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px}.resolve.bad{border:1px solid var(--neg)}
.hidden{display:none!important}.err{color:var(--neg);font-size:13px;margin:6px 0}
.spin{display:inline-block;width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}

.toast{background:#243044;color:#fff;border-radius:8px;padding:10px 14px;box-shadow:0 4px 16px rgba(0,0,0,.35);cursor:pointer}.toast.error{background:#b3261e}.toast.warn{background:#b45309}
.sched{max-width:360px}.sched td,.sched th{padding:5px 12px}
.loading{padding:40px;text-align:center;color:var(--muted)}
.modal.wide{max-width:1240px}
.lotrow td{background:var(--head);padding:6px 12px 12px 44px;white-space:normal}tbody tr.lotrow:hover td{background:var(--head)}
table.lots{width:auto;min-width:640px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}table.lots th{position:static;background:transparent;font-size:11px}table.lots td,table.lots th{padding:4px 10px;border-bottom:1px solid var(--line);font-size:12.5px}
.tk{border:0;background:none;font:inherit;font-weight:700;color:inherit;padding:0;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}.tk:hover{color:var(--accent);text-decoration:underline}
.linkmenu{position:fixed;z-index:60;min-width:290px;max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.28);padding:6px}
.linkmenu .lh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 6px 8px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}.linkmenu .lh .lt{min-width:0}.linkmenu .lh b{display:block}.linkmenu .lh span{color:var(--muted);font-size:12px}.linkmenu .lsplit{flex:none;padding:4px 10px;font-size:12.5px}
.linkmenu.iomenu{min-width:270px}.linkmenu.iomenu button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--text);font:inherit;padding:8px 10px;border-radius:6px;cursor:pointer}.linkmenu.iomenu button:hover,.linkmenu.iomenu button:focus-visible{background:var(--head);outline:none}.linkmenu.iomenu button small{display:block;color:var(--muted);font-size:11.5px}
.linkmenu a{display:block;padding:7px 10px;border-radius:6px;color:var(--text);text-decoration:none}.linkmenu a:hover,.linkmenu a:focus{background:var(--head);outline:none}.linkmenu a small{display:block;color:var(--muted);font-size:11.5px}.linkmenu a .ext{float:right;color:var(--muted)}
td .icon[data-act=toggle]{font-size:13px;padding:0 4px;margin-right:2px}.imp td,.imp th{padding:4px 6px}.imp input,.imp select{padding:3px 5px;font-size:12px}.imp td.iname{max-width:190px;overflow:hidden;text-overflow:ellipsis}.imp .istat{white-space:normal;min-width:180px;font-size:12px}
textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
.chart{width:100%;height:auto}.chart .grid{stroke:var(--line);stroke-width:1}.chart .axis{fill:var(--muted);font-size:11px}.chart .line{fill:none;stroke:var(--accent);stroke-width:2}.chart .dot{fill:var(--accent)}
@supports selector(::-webkit-scrollbar){::-webkit-scrollbar{width:12px;height:12px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--thumb);border-radius:8px;border:3px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background:var(--thumb-h);background-clip:padding-box;border:3px solid transparent}::-webkit-scrollbar-corner{background:transparent}}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:var(--thumb) transparent}}
/* shared pieces (desktop: the phone-only parts stay hidden) */
.tabs svg,.tabs .more-btn,.ph-only,.lclose,.linkback{display:none}
.tbf{display:contents}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:650;background:var(--head)}.chip.pos{background:rgba(15,157,88,.13)}.chip.neg{background:rgba(217,48,37,.13)}
.hgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.hchip{position:relative;display:block}.hchip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}.hchip span{display:block;text-align:center;padding:10px 0;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-variant-numeric:tabular-nums}.hchip input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-t);font-weight:600}.hchip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

/* ====================================================================== PHONE
   html.phone is set by a (max-width:760px) media query: once in index.html (no flash) and again by client.html when the window changes.
   Layout: the page itself scrolls (one scrollbar), a bottom tab bar, card lists instead of wide tables, dialogs as bottom sheets. */
html.phone{--nav-h:58px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html.phone,html.phone body{height:auto}
html.phone body{display:block;overflow:auto;-webkit-tap-highlight-color:transparent}
html.phone body.modal-open{overflow:hidden}
html.phone button,html.phone a,html.phone input,html.phone select,html.phone .pc-head{touch-action:manipulation}
html.phone .hdr{position:sticky;top:0;z-index:35;flex-wrap:nowrap;padding:8px 12px;gap:10px}
html.phone .hdr-l{min-width:0;flex:1 1 auto}
html.phone .hdr h1{font-size:17px;line-height:1.25}
html.phone .hdr-meta{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html.phone #nextRuns,html.phone .hdr-note{display:none}
html.phone #btnRefresh{flex:0 0 auto;white-space:nowrap;min-height:40px}html.phone .hdr-r{gap:6px}html.phone #btnTheme{width:40px;height:40px}html.phone #btnTheme svg{width:22px;height:22px}@media (max-width:399px){html.phone .hdr-meta{white-space:normal;overflow:visible}}   /* the date and time may wrap (together) instead of being cut off */
@media (max-width:359px){html.phone .hdr{padding:8px 10px;gap:8px}html.phone .hdr h1{font-size:15px}html.phone .hdr-r{gap:4px}html.phone #btnRefresh{padding:6px 10px;font-size:13px}html.phone #btnTheme{width:36px}html.phone #btnTheme svg{width:20px;height:20px}}
html.phone main{display:block;padding:10px 12px calc(var(--nav-h) + 96px + env(safe-area-inset-bottom))}
html.phone .tab.active,html.phone .tab.scroll.active{display:block;overflow:visible}
html.phone .tab.fill>.table-wrap{max-height:none}
/* bottom tab bar: Owned, Watchlist, Sold, Accounts and a More sheet (History, Schedule, Log) */
html.phone .tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;gap:0;padding:0 0 env(safe-area-inset-bottom);border-bottom:0;border-top:1px solid var(--line);overflow:visible;box-shadow:0 -2px 10px rgba(0,0,0,.08)}
html.phone .tabs button{flex:1 1 0;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:var(--nav-h);padding:6px 2px;font-size:11px;border-bottom:0}
html.phone .tabs button.active::before{content:'';position:absolute;top:0;left:24%;right:24%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
html.phone .tabs svg{display:block;width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
html.phone .tabs .more-btn svg circle{fill:currentColor;stroke:none}
html.phone .tabs .sec{display:none}
html.phone .tabs .more-btn{display:flex}
html.phone .tabs .more-btn.active{color:var(--accent);font-weight:600}
/* summary cards: the first one full width, the rest in pairs */
html.phone .cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
html.phone .card{min-width:0;padding:9px 12px}
html.phone .card:first-child,html.phone .card:last-child:nth-child(even){grid-column:1/-1}
html.phone .card .lbl{font-size:10.5px;line-height:1.3}
html.phone .card .val{font-size:20px}
html.phone .warnbox{font-size:12.5px;padding:8px 10px}
/* toolbar: search + Filters + More; the filter selects fold away; "+ Add" floats above the tab bar */
html.phone .toolbar{gap:8px;margin-bottom:10px;align-items:stretch}
html.phone .toolbar input[type=search]{order:1;flex:1 1 0;width:auto;min-width:0}
html.phone .toolbar .ph-only{display:inline-flex;align-items:center;justify-content:center;gap:6px;order:2}
html.phone .toolbar .tbf{display:none;order:5;flex:1 0 100%;grid-template-columns:1fr 1fr;gap:8px}
html.phone .toolbar.fopen .tbf,html.phone .toolbar.inline .tbf{display:grid}
html.phone .toolbar .tbf select{max-width:none;width:100%}
html.phone .tbf>select:last-child:nth-child(odd){grid-column:1/-1}
html.phone .toolbar .grow{display:none}
html.phone .toolbar:not(.keep)>.btn:not(.ph-only):not(.primary){display:none}
html.phone .toolbar .hide-ph{display:none!important}
html.phone .fcount:not(:empty){background:var(--accent);color:var(--accent-t);border-radius:10px;min-width:20px;padding:0 6px;font-size:12px;line-height:20px;font-weight:650}
html.phone .toolbar.inline .tbf{order:1}
html.phone .toolbar.inline>.btn{flex:1 0 100%;order:2}
html.phone .sched-tb{flex-direction:column;align-items:stretch}
html.phone .toolbar [data-act=add],html.phone .toolbar [data-act=addAcc]{position:fixed;right:14px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);z-index:30;min-height:50px;padding:0 22px;border-radius:26px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.3)}
html.phone .toolbar [data-act=add],html.phone .toolbar [data-act=addAcc]{transition:transform .2s ease,opacity .2s ease}
html.phone body.fab-hide .toolbar [data-act=add],html.phone body.fab-hide .toolbar [data-act=addAcc]{transform:translateY(calc(var(--nav-h) + 90px));opacity:0;pointer-events:none}
/* card lists */
html.phone #tbl.table-wrap{background:none;border:0;border-radius:0;box-shadow:none;overflow:visible;max-height:none}
.pcs{display:flex;flex-direction:column;gap:8px}
.pc{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.pc-head{padding:11px 12px 10px;cursor:pointer}
.pc-r{display:flex;justify-content:space-between;align-items:baseline;gap:10px;min-width:0}.pc-r+.pc-r{margin-top:3px}
.pc-id{min-width:0;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.pc .tk{font-size:15.5px;padding:8px 0;margin:-8px 0;text-decoration:underline dotted var(--muted);text-underline-offset:3px}
.pc-val{font-weight:650;font-size:16px;white-space:nowrap}
.pc-m{font-size:12.5px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-p{font-size:12.5px;font-weight:600;white-space:nowrap}
