<script>
(function () {
'use strict';

// ------------------------------------------------------------------ helpers
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const NA = '<span class="na">N/A</span>';
const isNum = v => typeof v === 'number' && isFinite(v);
const nf = (v, dp) => isNum(v) ? v.toLocaleString(undefined, { minimumFractionDigits: dp, maximumFractionDigits: dp }) : null;
const money = v => nf(v, 2) || NA;
const priceF = v => isNum(v) ? (nf(v, Math.abs(v) < 10 ? 4 : 2)) : NA;
const qtyF = v => isNum(v) ? v.toLocaleString(undefined, { maximumFractionDigits: 8 }) : NA;
const pctF = v => isNum(v) ? (v > 0 ? '+' : '') + nf(v, 2) + '%' : NA;
const signed = v => isNum(v) ? (v > 0 ? '+' : '') + nf(v, 2) : NA;
const plCls = v => !isNum(v) ? '' : v > 0 ? 'pos' : v < 0 ? 'neg' : '';
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const FN = { owned: 'getOwnedData', watch: 'getWatchlistData', sold: 'getSoldData', history: 'getHistoryData', accounts: 'getAccountsData', log: 'getLogData', schedule: 'getSchedule' };

function call(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  return new Promise(resolve => {
    try {
      google.script.run
        .withSuccessHandler(res => resolve(res || { success: false, message: 'Empty response from server', data: null }))
        .withFailureHandler(err => resolve({ success: false, message: (err && err.message) || String(err), data: null }))[fn].apply(null, args);
    } catch (e) { resolve({ success: false, message: String(e), data: null }); }
  });
}

function toast(msg, type) {
  const t = document.createElement('div');
  t.className = 'toast ' + (type || '');
  t.textContent = msg;
  t.onclick = () => t.remove();
  $('#toasts').appendChild(t);
  if (type !== 'error') setTimeout(() => t.remove(), 4000);     // errors stay until dismissed
}

// ------------------------------------------------------------------ phone layout (index.html sets html.phone early; this keeps it in step with the window)
const mq = window.matchMedia('(max-width: 760px), (max-height: 500px) and (pointer: coarse)');
let PHONE = mq.matches;
document.documentElement.classList.toggle('phone', PHONE);
const phoneUi = { filters: {} };                       // per tab: is the folded filter panel open?
const PH_BTNS = '<button class="btn ph-only" data-act="filters" aria-label="Filters"><span>Filters</span><span class="fcount"></span></button><button class="btn ph-only" data-act="more" aria-label="More actions">&#8943;</button>';
const sph = t => PHONE ? 'Search' : t;                  // shorter placeholder in the narrow search box
const kv = (l, v, cls) => '<div class="kv' + (cls ? ' ' + cls : '') + '"><span>' + l + '</span><b>' + v + '</b></div>';
function syncFilters(tab) {                             // number of active filters on the Filters button
  const el = root(tab), c = $('.fcount', el);
  if (c) { const n = $$('.tbf select', el).filter(x => x.id !== 'f-sort' && x.value !== '').length; c.textContent = n ? String(n) : ''; }
}
function afterRender(tab) {
  const tb = $('.toolbar', root(tab));
  if (tb && !tb.classList.contains('inline')) tb.classList.toggle('fopen', !!phoneUi.filters[tab]);
  syncFilters(tab);
}

// ------------------------------------------------------------------ state
const state = { tab: 'owned', owned: null, watch: null, sold: null, history: null, accounts: null, log: null, schedule: null, info: null };
let ACCOUNTS = [];                                   // known account names (datalist + filters)
function setAccounts(list) {
  ACCOUNTS = (list || []).slice();
  const dl = $('#accl');
  if (dl) dl.innerHTML = ACCOUNTS.map(a => '<option value="' + esc(a) + '"></option>').join('');
}
function lastAccount() { let v = ''; try { v = localStorage.getItem('lastAccount') || ''; } catch (e) { v = ''; } return ACCOUNTS.indexOf(v) >= 0 ? v : (ui.owned.account || ACCOUNTS[0] || ''); }
function rememberAccount(a) { try { localStorage.setItem('lastAccount', a); } catch (e) { /* storage may be blocked */ } }
const ui = {
  owned: { market: '', q: '', sort: 'name', account: '', tk: '', open: {} }, watch: { market: '', q: '', sort: 'name', status: '' },
  sold: { market: '', q: '', sort: 'sellDate', account: '', year: '' }, log: { status: '', q: '' }, history: { account: 'ALL', range: '90' }
};
const colSort = {};
let SYMBOLS = [];                                   // the Symbols tab, loaded once at start and refreshed after each confirmed add
async function loadSymbols() { const r = await call('getSymbols'); if (r.success && Array.isArray(r.data)) SYMBOLS = r.data; }
function rankSymbols(v) {                           // exact symbol > symbol prefix > name prefix > contains
  const lv = v.toLowerCase(), out = [];
  SYMBOLS.forEach(s => {
    const t = s.ticker.toLowerCase(), sym = t.split(':')[1] || t, n = (s.name || '').toLowerCase();
    const score = (t === lv || sym === lv) ? 0 : (sym.startsWith(lv) || t.startsWith(lv)) ? 1 : n.startsWith(lv) ? 2 : (t.includes(lv) || n.includes(lv)) ? 3 : -1;
    if (score >= 0) out.push([score, s]);
  });
  out.sort((a, b) => a[0] - b[0]);
  return out.slice(0, 8).map(x => x[1]);
}

// ------------------------------------------------------------------ saved preferences (column widths / hidden columns) + cash state
let PREFS = { cols: {} }, prefsTimer = null, lastResize = 0, ACCOUNT_CASH = {};
const tp = tab => (PREFS.cols[tab] = PREFS.cols[tab] || { hidden: [], widths: {} });
function savePrefs() { clearTimeout(prefsTimer); prefsTimer = setTimeout(() => call('saveUiPrefs', PREFS), 600); }
async function loadPrefs() {
  const r = await call('getUiPrefs');
  if (r.success && r.data && r.data.cols) { PREFS = r.data; applyView(); if (state[state.tab]) render(state.tab); }
}
/** The last sort of Owned, Watchlist and Sold is saved with the column layout and restored at start. Anything unknown (an older save, a renamed column) is ignored. */
function applyView() {
  const v = PREFS.view || {}, P = { owned: ownedPresets, watch: watchPresets, sold: soldPresets }, C = { owned: ownedCols, watch: watchCols, sold: soldCols };
  Object.keys(P).forEach(t => {
    const x = v[t];
    if (!x) return;
    if (x.sort && P[t][x.sort]) ui[t].sort = x.sort;
    if (x.col && C[t].some(c => c.sort === x.col.key)) colSort[t] = { key: x.col.key, dir: x.col.dir }; else delete colSort[t];
  });
}
function saveView(tab) {
  if (['owned', 'watch', 'sold'].indexOf(tab) < 0) return;
  PREFS.view = PREFS.view || {};
  PREFS.view[tab] = { sort: ui[tab].sort, col: colSort[tab] || null };
  savePrefs();
}
function cashFor(a) { const k = String(a || '').trim().toLowerCase(), n = Object.keys(ACCOUNT_CASH).find(x => x.toLowerCase() === k); return n ? ACCOUNT_CASH[n] : null; }
const cashTxt = c => (nf(c.cash, 2) || '0.00') + ' ' + c.ccy;
const TABLE_TABS = { owned: 1, watch: 1, sold: 1, log: 1, accounts: 1 };
const DEFAULT_W = {
  owned: { ticker: 215, account: 190, market: 84, name: 220, currency: 64, buyDate: 108, lastBuyDate: 108, buyPrice: 140, qty: 90, price: 135, totalCost: 135, totalActual: 145, pl: 115, plPct: 95, allocPct: 90, high52: 105, low52: 105, quoteTime: 140, note: 240, c19: 90 },
  watch: { ticker: 175, market: 84, name: 230, currency: 64, wstatus: 95, price: 140, change: 100, changePct: 105, high52: 105, low52: 105, quoteTime: 140, note: 240, c12: 60 },
  sold: { ticker: 175, account: 190, market: 84, name: 210, currency: 64, buyDate: 108, buyPrice: 105, sellDate: 108, sellPrice: 105, qty: 90, realized: 125, fx: 95, realizedEur: 160, note: 240, c14: 130 },
  log: { time: 160, action: 150, details: 560, status: 90 },
  accounts: { name: 170, holdings: 95, sold: 60, invested: 125, value: 115, realized: 130, cash: 175, cashEur: 105, total: 115, c9: 300 }
};
const colKey = (c, i) => c.key || c.sort || ('c' + i);

// ------------------------------------------------------------------ research links (open in a new tab)
const US_PAGES = ['NASDAQ', 'NYSE', 'NYSEARCA', 'NYSEAMERICAN'];
/** Links for one listing. ticker is EXCHANGE:SYMBOL; ysym is the verified/mapped Yahoo symbol. */
function researchLinks(ticker, ysym, name) {
  const i = String(ticker).indexOf(':'), exch = String(ticker).slice(0, i), sym = String(ticker).slice(i + 1), enc = encodeURIComponent, y = ysym || sym;
  const out = [{ label: 'Yahoo Finance', note: 'Quote, chart and key statistics', url: 'https://finance.yahoo.com/quote/' + enc(y) + '/' },
    { label: 'Yahoo Finance: analyst view', note: 'Ratings, price targets and estimates (stocks; not for most ETFs)', url: 'https://finance.yahoo.com/quote/' + enc(y) + '/analysis/' }];
  if (US_PAGES.indexOf(exch) >= 0 && /^[A-Z0-9]+$/.test(sym)) out.push({ label: 'Perplexity Finance', note: 'AI-assisted page for this ticker', url: 'https://www.perplexity.ai/finance/' + enc(sym) });
  else out.push({ label: 'Perplexity search', note: 'Asks about this stock: analyst ratings, targets, outlook', url: 'https://www.perplexity.ai/search?q=' + enc((name || sym) + ' (' + sym + ' on ' + exch + ') stock: analyst ratings, price target, valuation and outlook') });
  out.push({ label: 'Google Finance', note: 'Quote and news (not every listing exists there)', url: 'https://www.google.com/finance/quote/' + enc(sym) + ':' + enc(exch) });
  return out;
}
window.__links = { researchLinks };
/** Notes: a small icon next to the ticker (filled when a note exists), a Note column in the tables, and a note line on the phone cards. */
const NOTE_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h10l4 4v14H5z"/><path d="M14 3v5h5"/><path d="M8.5 13h7M8.5 17h5"/></svg>';
const noteAttr = (k, r) => ' data-act="note" data-k="' + k + '" data-t="' + esc(r.ticker) + '"' + (k === 'owned' ? ' data-a="' + esc(r.account) + '"' : '') + (k === 'sold' ? ' data-s="' + esc(r.saleId || '') + '"' : '');
const noteBtn = (k, r) => '<button type="button" class="nb' + (r.note ? ' has' : '') + '"' + noteAttr(k, r) + ' title="' + (r.note ? esc(r.note.length > 400 ? r.note.slice(0, 400) + '...' : r.note) : 'Add a note') + '" aria-label="' + (r.note ? 'Edit note' : 'Add note') + '">' + NOTE_SVG + '</button>';
const noteCell = (k, r) => r.note ? '<span class="notetxt"' + noteAttr(k, r) + ' title="' + esc(r.note) + '">' + esc(r.note) + '</span>' : '';
const noteLine = (k, r) => r.note ? '<div class="pc-note"' + noteAttr(k, r) + '>' + NOTE_SVG + '<span>' + esc(r.note) + '</span></div>' : '';
const tkBtn = r => '<button class="tk" data-act="links" data-t="' + esc(r.ticker) + '" data-y="' + esc(r.ysym || '') + '" data-n="' + esc(r.name || '') + '" title="Open research links (Yahoo, Perplexity, Google)">' + esc(r.ticker) + '</button>';
function closeLinkMenu() { $$('.linkmenu,.linkback').forEach(x => x.remove()); }
function openLinkMenu(btn) {
  closeLinkMenu();
  const links = researchLinks(btn.dataset.t, btn.dataset.y, btn.dataset.n), m = document.createElement('div');
  m.className = 'linkmenu';
  const canSplit = !!btn.closest('#tab-owned');                                  // a split concerns shares you hold, so only the Owned tab offers it
  m.innerHTML = '<div class="lh"><div class="lt"><b>' + esc(btn.dataset.t) + '</b><span>' + esc(btn.dataset.n || '') + '</span></div>' + (canSplit ? '<button type="button" class="btn lsplit" title="Adjust quantity and buy price after a stock split (every account)">Stock split&hellip;</button>' : '') + '</div>' +
    links.map(l => '<a href="' + esc(l.url) + '" target="_blank" rel="noopener noreferrer">' + esc(l.label) + '<span class="ext">&#8599;</span><small>' + esc(l.note) + '</small></a>').join('') +
    '<div class="muted small" style="padding:6px 10px 2px">Opens in a new tab. Ratings are opinions, not advice.</div><button type="button" class="btn lclose">Close</button>';
  if (PHONE) { const bk = document.createElement('div'); bk.className = 'linkback'; document.body.appendChild(bk); }
  document.body.appendChild(m);
  const r = btn.getBoundingClientRect(), w = m.offsetWidth, hgt = m.offsetHeight;
  m.style.left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8)) + 'px';
  m.style.top = (r.bottom + 4 + hgt > window.innerHeight ? Math.max(8, r.top - hgt - 4) : r.bottom + 4) + 'px';
  m.addEventListener('click', e => { const sp = e.target.closest('.lsplit'); setTimeout(closeLinkMenu, 0); if (sp) openSplit(btn.dataset.t); });
}
/** The Owned toolbar's Import / Export dropdown. */
function openIoMenu(btn) {
  closeLinkMenu();
  const m = document.createElement('div');
  m.className = 'linkmenu iomenu';
  m.setAttribute('role', 'menu');
  m.innerHTML = '<button type="button" role="menuitem" data-io="import">Import from spreadsheet&hellip;<small>Paste rows copied from Excel or Google Sheets</small></button>' +
    '<button type="button" role="menuitem" data-io="export">Export to CSV&hellip;<small>Download or copy your holdings, per position or per lot</small></button>';
  document.body.appendChild(m);
  const r = btn.getBoundingClientRect(), w = m.offsetWidth, hgt = m.offsetHeight;
  m.style.left = Math.max(8, Math.min(r.right - w, window.innerWidth - w - 8)) + 'px';
  m.style.top = (r.bottom + 4 + hgt > window.innerHeight ? Math.max(8, r.top - hgt - 4) : r.bottom + 4) + 'px';
  m.addEventListener('click', e => { const b = e.target.closest('[data-io]'); if (!b) return; closeLinkMenu(); if (b.dataset.io === 'import') openImport(); else openExport('owned'); });
  const first = $('button', m); if (first) first.focus();
}
document.addEventListener('mousedown', e => { if (!e.target.closest('.linkmenu') && !e.target.closest('.tk') && !e.target.closest('[data-act=ioMenu]')) closeLinkMenu(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLinkMenu(); });
window.addEventListener('resize', closeLinkMenu);

// ------------------------------------------------------------------ generic table
function cmp(a, b) {
  const an = a == null || (typeof a === 'number' && !isFinite(a)), bn = b == null || (typeof b === 'number' && !isFinite(b));
  if (an && bn) return 0; if (an) return 1; if (bn) return -1;           // nulls always last
  return typeof a === 'number' && typeof b === 'number' ? a - b : String(a).localeCompare(String(b));
}
function sortRows(rows, key, dir) {
  const out = rows.slice();
  out.sort((x, y) => {
    const a = x[key], b = y[key];
    const an = a == null, bn = b == null;
    const c = (an || bn) ? cmp(a, b) : cmp(a, b) * dir;                  // keep nulls last regardless of direction
    return c || cmp(x.ticker, y.ticker) || cmp(x.account, y.account);    // ties: same ticker stay together, accounts in order
  });
  return out;
}
function tableHtml(tab, cols, rows, rowAttr, extra) {
  const cs = colSort[tab], fx = !!TABLE_TABS[tab], pf = fx ? tp(tab) : { hidden: [], widths: {} };
  // the first column and the action column are always shown; every other column can be hidden
  const meta = cols.map((c, i) => ({ c, i, k: colKey(c, i) })).filter(m => !(m.i > 0 && m.c.label !== '' && pf.hidden.indexOf(m.k) >= 0));
  const wOf = m => Math.max(40, Math.min(1200, pf.widths[m.k] || (DEFAULT_W[tab] || {})[m.k] || 110));
  const total = meta.reduce((a, m) => a + wOf(m), 0);
  let h = '<table' + (fx ? ' class="fx" style="width:max(100%,' + total + 'px)"' : '') + '>' + (fx ? '<colgroup>' + meta.map(m => '<col data-k="' + m.k + '" style="width:' + wOf(m) + 'px">').join('') + '</colgroup>' : '') +
    '<thead><tr>' + meta.map(m => '<th class="' + (m.c.num ? 'num ' : '') + (m.c.sort ? 'sortable' : '') + (m.c.label === '' ? ' act' : '') + '" data-sort="' + (m.c.sort || '') + '" data-k="' + m.k + '">' + m.c.label +
      (cs && m.c.sort && cs.key === m.c.sort ? (cs.dir > 0 ? ' &#9650;' : ' &#9660;') : '') + (fx && m.c.label !== '' ? '<span class="rz" data-k="' + m.k + '" title="Drag to resize, double-click to fit"></span>' : '') + '</th>').join('') + '</tr></thead><tbody>';
  if (!rows.length) h += '<tr><td colspan="' + meta.length + '" class="empty">No data</td></tr>';
  rows.forEach(r => {
    h += '<tr' + (rowAttr ? rowAttr(r) : '') + '>' + meta.map(m => '<td class="' + (m.c.num ? 'num ' : '') + (m.c.cls ? m.c.cls(r) : '') + (m.c.label === '' ? ' act' : '') + '">' + m.c.html(r) + '</td>').join('') + '</tr>' + (extra ? extra(r, meta.length) : '');
  });
  return h + '</tbody></table>';
}
function badge(r) {
  if (!r.pstatus || r.pstatus === 'OK') return '';
  const tip = 'Quote time: ' + (r.quoteTime || 'n/a') + ' | Source: ' + (r.source || '?') + (r.writer ? ' (' + r.writer + ')' : '');
  return '<span class="badge ' + esc(r.pstatus.toLowerCase()) + '" title="' + esc(tip) + '">' + esc(r.pstatus) + '</span>';
}
function marketOptions(rows, sel) {
  const ms = Array.from(new Set(rows.map(r => r.market).filter(Boolean))).sort();
  return '<option value="">All markets</option>' + ms.map(m => '<option value="' + esc(m) + '"' + (m === sel ? ' selected' : '') + '>' + esc(m) + '</option>').join('');
}
function filtered(rows, u) {
  const q = (u.q || '').toLowerCase();
  return rows.filter(r => (!u.market || r.market === u.market) && (!u.status || r.wstatus === u.status) && (!u.account || r.account === u.account) &&
    (!u.year || String(r.sellDate || '').slice(0, 4) === u.year) && (!u.tk || r.ticker === u.tk) && (!q || (r.ticker + ' ' + (r.name || '') + ' ' + (r.account || '') + ' ' + (r.note || '')).toLowerCase().includes(q)));
}
function accountOptions(sel, allLabel) { return '<option value="">' + allLabel + '</option>' + ACCOUNTS.map(a => '<option value="' + esc(a) + '"' + (a === sel ? ' selected' : '') + '>' + esc(a) + '</option>').join(''); }
function applySort(tab, rows, presets) {
  const cs = PHONE ? null : colSort[tab];
  if (cs) return sortRows(rows, cs.key, cs.dir);
  const p = presets[ui[tab].sort] || Object.values(presets)[0];
  return sortRows(rows, p[0], p[1]);
}
function selectHtml(id, opts, cur) { return '<select id="' + id + '">' + opts.map(o => '<option value="' + o[0] + '"' + (o[0] === cur ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select>'; }

// ------------------------------------------------------------------ tab loading
function root(tab) { return $('#tab-' + tab); }
async function loadTab(tab, force) {
  const el = root(tab);
  if (!force && state[tab]) return render(tab);
  el.innerHTML = '<div class="loading"><span class="spin"></span>Loading...</div>';
  const res = await call(FN[tab]);
  if (!res.success) { el.innerHTML = '<div class="warnbox">Could not load: ' + esc(res.message) + ' <button class="btn" data-act="reload">Retry</button></div>'; return; }
  state[tab] = res.data;
  if (tab === 'owned' && res.data.cash) ACCOUNT_CASH = res.data.cash;
  if (tab === 'accounts') setAccounts(res.data.accounts.map(a => a.name)); else if (res.data.accounts && typeof res.data.accounts[0] === 'string') setAccounts(res.data.accounts);
  render(tab);
}
function invalidate() {
  state.owned = state.watch = state.sold = state.log = state.accounts = null;
  loadTab(state.tab, true);
  loadInfo();
}
function render(tab) { ({ owned: renderOwned, watch: renderWatch, sold: renderSold, history: renderHistory, accounts: renderAccounts, schedule: renderSchedule, log: renderLog })[tab](); }

// ------------------------------------------------------------------ OWNED
const rowKey = r => r.ticker + '\u241F' + r.account;
const actAttr = r => ' data-t="' + esc(r.ticker) + '" data-a="' + esc(r.account) + '"';
/** The same ticker held in other accounts is a separate position per account. Each row says so, and a click shows all of them together. */
let alsoIdx = {};                                       // ticker -> every position of it (rebuilt by fillOwned, from all rows, whatever the filters)
const othersOf = r => (alsoIdx[r.ticker] || []).filter(x => x.account !== r.account);
const alsoFull = o => o.map(x => x.account + ': ' + qtyF(x.qty)).join(', ');
const alsoTxt = o => o.length === 1 ? o[0].account + ': ' + qtyF(o[0].qty) : o.length + ' other accounts: ' + qtyF(+o.reduce((a, x) => a + (+x.qty || 0), 0).toFixed(8));       // short enough for the column; the tooltip lists them all
const alsoTip = (r, o) => 'Also held in ' + alsoFull(o) + '. Click to show every position of ' + r.ticker + '.';
const alsoBtn = r => { const o = othersOf(r); return o.length ? '<button type="button" class="also" data-act="tkfilter" data-t="' + esc(r.ticker) + '" title="' + esc(alsoTip(r, o)) + '">Also in ' + esc(alsoTxt(o)) + '</button>' : ''; };
const alsoLine = r => { const o = othersOf(r); return o.length ? '<div class="pc-also" data-act="tkfilter" data-t="' + esc(r.ticker) + '" title="' + esc(alsoTip(r, o)) + '"><span>Also in ' + esc(alsoTxt(o)) + '</span><b>Show all &rsaquo;</b></div>' : ''; };
const ownedCols = [
  { label: 'Ticker', sort: 'ticker', html: r => '<button class="icon" data-act="toggle"' + actAttr(r) + ' title="Show the lots (purchases)">' + (ui.owned.open[rowKey(r)] ? '&#9662;' : '&#9656;') + '</button>' + tkBtn(r) + noteBtn('owned', r) + (r.lotCount > 1 ? '<span class="sub">' + r.lotCount + ' lots</span>' : '') },
  { label: 'Account', sort: 'account', html: r => esc(r.account) + alsoBtn(r) },
  { label: 'Market', sort: 'market', html: r => esc(r.market) },
  { label: 'Name', sort: 'name', html: r => esc(r.name) },
  { label: 'Ccy', sort: 'currency', html: r => esc(r.currency) },
  { label: 'First Buy', sort: 'buyDate', html: r => esc(r.buyDate) },
  { label: 'Last Buy', sort: 'lastBuyDate', html: r => esc(r.lastBuyDate) },
  { label: 'Avg Buy Price', sort: 'buyPrice', num: true, html: r => priceF(r.buyPrice) },
  { label: 'Qty', sort: 'qty', num: true, html: r => qtyF(r.qty) },
  { label: 'Actual Price', sort: 'price', num: true, html: r => priceF(r.price) + badge(r) },
  { label: 'Total Cost', sort: 'totalCost', num: true, html: r => money(r.totalCost) + '<span class="sub">' + esc(r.majorCcy) + '</span>' },
  { label: 'Total Actual', sort: 'totalActual', num: true, html: r => money(r.totalActual) + (isNum(r.totalActual) ? '<span class="sub">' + esc(r.majorCcy) + '</span>' : '') },
  { label: 'P/L', sort: 'pl', num: true, cls: r => plCls(r.pl), html: r => signed(r.pl) },

  const good = missing.length === 0, eur = rows.reduce((a, r) => a + (isNum(r.valueEur) ? r.valueEur : 0), 0), pl = rows.reduce((a, r) => a + (isNum(r.plEur) ? r.plEur : 0), 0);

  return { eur: good ? eur : null, huf: (good && isNum(eurhuf)) ? eur * eurhuf : null, plEur: good ? pl : null, missing };
}

// ------------------------------------------------------------------ modal infrastructure
let modalEl = null;
function closeModal() { if (modalEl) { modalEl.remove(); modalEl = null; } document.body.classList.remove('modal-open'); }
function openModal(o) {
  closeModal();
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = '<div class="modal' + (o.wide ? ' wide' : '') + '"><h2>' + esc(o.title) + '</h2><div class="body">' + o.body + '</div><div class="foot"><button class="btn" data-m="cancel">' + esc(o.cancelLabel || 'Cancel') + '</button>' +
    (o.submit ? '<button class="btn ' + (o.danger ? 'danger' : 'primary') + '" data-m="submit">' + esc(o.submit) + '</button>' : '') + '</div></div>';
  ov.addEventListener('mousedown', e => { if (e.target === ov) closeModal(); });
  ov.addEventListener('click', async e => {
    const b = e.target.closest('[data-m]');
    if (!b) return;
    if (b.dataset.m === 'cancel') return closeModal();
    if (b.dataset.m === 'submit' && o.onSubmit) {
      b.disabled = true;
      const old = b.textContent;
      b.innerHTML = '<span class="spin"></span>' + esc(old);
      let keep = false;
      try { keep = (await o.onSubmit(ov)) === false; } finally { if (modalEl === ov) { b.disabled = false; b.textContent = old; } }
      if (!keep && modalEl === ov) closeModal();
    }
  });
  document.body.appendChild(ov);
  document.body.classList.add('modal-open');
  modalEl = ov;
  if (o.onOpen) o.onOpen(ov);
  return ov;
}
function setErr(m, msg) { let e = $('.err', m); if (!e) { e = document.createElement('div'); e.className = 'err'; $('.body', m).appendChild(e); } e.textContent = msg || ''; }
function confirmModal(title, text, label, danger) {
  return new Promise(resolve => {
    let done = false;
    const m = openModal({ title, body: '<p>' + text + '</p>', submit: label, danger, onSubmit: () => { done = true; resolve(true); } });
    new MutationObserver((_, ob) => { if (!document.body.contains(m)) { ob.disconnect(); if (!done) resolve(false); } }).observe(document.body, { childList: true });
  });
}
async function mutate(promise, okMsg) {
  const r = await promise;
  if (r.success) { toast(okMsg || r.message); invalidate(); } else toast(r.message, 'error');

// ------------------------------------------------------------------ SELL
function openSell(t, a, lotId) {
  const r = state.owned.rows.find(x => x.ticker === t && x.account === a);
  if (!r) return;
  const fxKnown = isNum(r.fxEur), lots = r.lots, rnd = x => Math.round(x * 1e8) / 1e8;
  const lotRow = l => '<tr><td data-lbl="Bought">' + esc(l.buyDate) + '</td><td class="num" data-lbl="Held">' + (l.daysHeld == null ? '&ndash;' : l.daysHeld + ' d') + '</td><td class="num" data-lbl="Buy price">' + priceF(l.buyPrice) + '</td><td class="num" data-lbl="Available">' + qtyF(l.qty) + '</td>' +
    '<td class="num ret" data-lbl="Return at this price" data-ret="' + esc(l.lotId) + '"></td><td class="num lsell" data-lbl="Quantity to sell"><input class="lq" data-l="' + esc(l.lotId) + '" type="number" step="any" min="0" value="0" style="width:92px"></td></tr>';
  const body = '<p><b>' + esc(r.ticker) + '</b> &middot; ' + esc(r.name) + '<br><span class="muted">' + esc(r.account) + ' &middot; owned ' + qtyF(r.qty) + ' in ' + r.lotCount + ' lot' + (r.lotCount === 1 ? '' : 's') + ', average ' + priceF(r.buyPrice) + ' ' + esc(r.currency) + '</span></p>' +
    (r.note ? '<div class="notebox"><b>Your note on this position</b><div>' + esc(r.note) + '</div></div>' : '') +
    '<div class="row2"><div class="field"><label>Sell price (' + esc(r.currency) + ')</label><input id="sp" type="number" step="any" value="' + (isNum(r.price) ? r.price : '') + '"></div>' +
    '<div class="field"><label>Quantity to sell</label><input id="sq" type="number" step="any" value="' + r.qty + '"></div></div>' +
    '<div class="field"><label>Which lots to sell from</label><select id="sm"><option value="fifo">Oldest first (FIFO)</option><option value="best">Best return first</option><option value="worst">Worst return first</option><option value="manual">I choose the quantities below</option></select></div>' +
    '<div class="table-wrap lotbox" style="max-height:30vh;margin-bottom:12px"><table class="lots"><thead><tr><th>Bought</th><th class="num">Held</th><th class="num">Buy price</th><th class="num">Available</th><th class="num">Return at this price</th><th class="num">Sell</th></tr></thead><tbody>' + lots.map(lotRow).join('') + '</tbody></table></div>' +
    '<div class="row2"><div class="field"><label>Sell date</label><input id="sd" type="date" value="' + today() + '" max="' + today() + '"></div>' +
    '<div class="field"><label>FX ' + esc(r.majorCcy) + ' &rarr; EUR' + (fxKnown ? ' (frozen at sale)' : ' (enter manually)') + '</label><input id="fx" type="number" step="any" value="' + (fxKnown ? r.fxEur : '') + '"' + (fxKnown ? ' readonly' : '') + '></div></div>' +
    '<div class="field"><label>Why are you selling? (optional, saved with the sale)</label><textarea id="why" rows="2" maxlength="4000" placeholder="e.g. reached my target, thesis changed, need the cash"></textarea>' + (r.note ? '<div class="muted small" style="margin-top:4px">If you sell everything, your note on this position is added to the sale\'s note.</div>' : '') + '</div>' +
    '<div class="resolve" id="prev"></div><div class="field" id="wl"><label><input type="checkbox" id="aw" style="width:auto"> Add to Watchlist after selling everything</label></div>' +
    (cashFor(r.account) ? '<div class="field"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="addc" checked style="width:auto"><span>Add the proceeds to the account\'s available cash (' + esc(cashTxt(cashFor(r.account))) + ')</span></label></div>' : '');
  openModal({
    title: 'Sell', body, submit: 'Record sale', wide: lots.length > 3,
    onOpen: m => {
      const sp = () => Number($('#sp', m).value), sqEl = $('#sq', m), smEl = $('#sm', m), lqs = () => $$('.lq', m);
      const ret = l => sp() > 0 ? (sp() - l.buyPrice) / l.buyPrice * 100 : null, rv = l => { const v = ret(l); return v === null ? 0 : v; };
      const allocate = (method, q) => {
        const order = lots.slice();
        if (method === 'best') order.sort((x, y) => rv(y) - rv(x)); else if (method === 'worst') order.sort((x, y) => rv(x) - rv(y));
        const out = {}; let left = q;
        order.forEach(l => { const take = Math.min(l.qty, Math.max(0, left)); out[l.lotId] = rnd(take); left = rnd(left - take); });
        return out;
      };
      const summarize = () => {
        const sel = lqs().map(i => ({ l: lots.find(x => x.lotId === i.dataset.l), q: Number(i.value) || 0 })).filter(x => x.q > 0);
        const total = rnd(sel.reduce((s, x) => s + x.q, 0)), fx = Number($('#fx', m).value);
        const pl = sel.reduce((s, x) => s + (sp() - x.l.buyPrice) * x.q / r.divisor, 0);
        $('#prev', m).innerHTML = sel.length && sp() > 0 ? 'Selling <b>' + qtyF(total) + '</b> from ' + sel.length + ' lot' + (sel.length === 1 ? '' : 's') + ': realized P/L <b class="' + plCls(pl) + '">' + signed(pl) + ' ' + esc(r.majorCcy) + '</b>' + (fx > 0 ? ' &asymp; <b class="' + plCls(pl) + '">' + signed(pl * fx) + ' EUR</b>' : '') : 'Choose how much to sell.';
        $('#wl', m).classList.toggle('hidden', Math.abs(total - rnd(r.qty)) > 1e-9);
      };
      const paintReturns = () => lots.forEach(l => { const v = ret(l), el = $('[data-ret="' + l.lotId + '"]', m); el.className = 'num ret ' + plCls(v); el.textContent = v === null ? '' : pctF(v); });
      const apply = () => { if (smEl.value !== 'manual') { const out = allocate(smEl.value, Number(sqEl.value) || 0); lqs().forEach(i => { i.value = out[i.dataset.l]; }); } summarize(); };
      $('#sp', m).addEventListener('input', () => { paintReturns(); apply(); });
      sqEl.addEventListener('input', () => { if (smEl.value === 'manual') smEl.value = 'fifo'; apply(); });
      smEl.addEventListener('input', apply);
      $('#fx', m).addEventListener('input', summarize);
      lqs().forEach(i => i.addEventListener('input', () => { smEl.value = 'manual'; sqEl.value = rnd(lqs().reduce((s, x) => s + (Number(x.value) || 0), 0)); summarize(); }));
      paintReturns();
      if (lotId) {                                           // "Sell this lot": that lot, fully
        const l = lots.find(x => x.lotId === lotId);
        smEl.value = 'manual'; lqs().forEach(i => { i.value = i.dataset.l === lotId ? l.qty : 0; }); sqEl.value = l ? l.qty : r.qty; summarize();
      } else apply();
    },
    onSubmit: async m => {
      const plan = $$('.lq', m).map(i => ({ lotId: i.dataset.l, qty: Number(i.value) || 0 })).filter(x => x.qty > 0), total = rnd(plan.reduce((s, x) => s + x.qty, 0));
      if (!plan.length) { setErr(m, 'Enter a quantity for at least one lot.'); return false; }
      const res = await call('recordSell', r.ticker, r.account, Number($('#sp', m).value), total, $('#sd', m).value, fxKnown ? null : $('#fx', m).value, $('#aw', m).checked, plan, cashFor(r.account) ? $('#addc', m).checked : true, $('#why', m).value);
      if (res.success) { toast(res.message); invalidate(); return true; }
      setErr(m, res.message); return false;
    }
  });
}

    },

      if (!res.success) { setErr(ov, res.message); return false; }

function renderHistory() {

  const days = Number(u.range || 0), last = all.length ? Date.parse(all[all.length - 1].date + 'T00:00:00') : 0;

  const good = rows.filter(r => r.missing === 0);
  let chart = '<div class="loading">No snapshots yet. The first one is recorded tonight at 23:00, or click <b>Record snapshot now</b>.</div>', stat = '';
  if (good.length) {
    const W = PHONE ? 370 : 900, H = PHONE ? 240 : 300, L = PHONE ? 46 : 70, R = PHONE ? 12 : 20, T = 16, B = 34;
    const axisNum = v => PHONE && Math.abs(v) >= 1e6 ? (v / 1e6).toFixed(1) + 'M' : PHONE && Math.abs(v) >= 1e4 ? Math.round(v / 1e3) + 'k' : Math.round(v).toLocaleString();
    const xs = good.map(r => Date.parse(r.date + 'T00:00:00')), ys = good.map(r => r.valueEur);

    box.innerHTML = '<div class="toolbar keep"><label>If a holding already exists in that account: <select id="imode"><option value="skip">Skip it</option><option value="add">Add as a new lot</option><option value="replace">Replace it (all its lots)</option></select></label>' +
      '<label>Default buy date <input type="date" id="idef2" value="' + esc(imp.defDate) + '" max="' + today() + '"></label>' +
      '<label title="Leave this off when you are loading holdings you already paid for"><input type="checkbox" id="idedc"' + (imp.deduct ? ' checked' : '') + '> Deduct purchases from the accounts\' available cash</label><span class="grow"></span>' +
      '<button class="btn" id="isall">Select all</button><button class="btn" id="isnone">Select none</button>' +
      Object.keys(brokers).map(b => '<button class="btn ichip" data-b="' + esc(b) + '">Select ' + esc(b) + ' (' + brokers[b] + ')</button>').join('') + '</div>' +
      '<div class="toolbar keep"><b>With the selected rows:</b> Account <input id="ibacc" list="accl" autocomplete="off" style="width:190px"> <button class="btn" id="ibaccgo">Apply</button> ' +
      '<select id="ibact"><option value="">Action...</option><option value="owned">Owned</option><option value="watch">Watchlist</option><option value="skip">Skip</option></select> <button class="btn" id="ibactgo">Apply</button></div>' +
      '<div id="isum" class="resolve"></div><div class="table-wrap" style="max-height:46vh"><table class="imp"><thead><tr><th></th><th>Action</th><th>Account</th><th>Ticker</th><th>Name</th><th>Buy date</th><th>Buy price</th><th>Qty</th><th>Cur</th><th>Broker</th><th>Status</th></tr></thead><tbody>' +
      imp.rows.map(rowHtml).join('') + '</tbody></table></div>' +
      '<div id="ifail"></div><div style="display:flex;justify-content:space-between;margin-top:10px"><button class="btn" id="iback2">Back to column mapping</button><button class="btn primary" id="igo">Import</button></div>';
    $('#imode', box).value = imp.mode;
    paint();
    box.onchange = box.oninput = e => {
      const t = e.target;
      if (t.id === 'imode') { imp.mode = t.value; paint(); return; }
      if (t.id === 'idedc') { imp.deduct = t.checked; return; }
      if (t.id === 'idef2') { imp.defDate = t.value || today(); queue(); return; }
      if (t.classList.contains('isel')) { imp.rows[+t.dataset.i].sel = t.checked; return; }
      if (t.classList.contains('icand')) { const r = imp.rows[+t.dataset.i]; if (t.value) { r.ticker = t.value; $('.ifld[data-f=ticker][data-i="' + t.dataset.i + '"]', box).value = t.value; queue(); } return; }
      if (!t.classList.contains('ifld')) return;
      const r = imp.rows[+t.dataset.i], f = t.dataset.f;
      if (r.done) return;
      r.failed = false; r.state = '';                                    // edited: re-check it
      if (f === 'action') r.action = t.value;
      else if (f === 'account') r.account = t.value.trim();
      else if (f === 'ticker') r.ticker = t.value.trim().toUpperCase().replace(/^\$/, '');
      else if (f === 'date') { const d = parseDate(t.value); r.dateRaw = t.value; r.date = d === null ? '' : d; r.dateErr = d === null; }
      else if (f === 'currency') r.currency = t.value.trim();
      else { const v = parseNum(t.value, imp.fmt); r[f] = isFinite(v) ? v : null; }
      queue();
    };
    box.onclick = async e => {
      const b = e.target.closest('button');
      if (!b) return;
      const sel = () => imp.rows.filter(r => r.sel && !r.done);
      if (b.id === 'isall' || b.id === 'isnone') { imp.rows.forEach(r => { r.sel = b.id === 'isall'; }); $$('.isel', box).forEach(x => { x.checked = b.id === 'isall'; }); }
      else if (b.classList.contains('ichip')) { imp.rows.forEach((r, i) => { if (r.broker === b.dataset.b) { r.sel = true; $('.isel[data-i="' + i + '"]', box).checked = true; } }); }
      else if (b.id === 'ibaccgo') { const a = $('#ibacc', box).value.trim(); if (a) { sel().forEach(r => { r.account = a; }); imp.rows.forEach((r, i) => { if (r.sel && !r.done) $('.ifld[data-f=account][data-i="' + i + '"]', box).value = a; }); queue(); } }
      else if (b.id === 'ibactgo') { const a = $('#ibact', box).value; if (a) { sel().forEach(r => { r.action = a; }); imp.rows.forEach((r, i) => { if (r.sel && !r.done) $('.ifld[data-f=action][data-i="' + i + '"]', box).value = a; }); queue(); } }
      else if (b.id === 'iback2') step2();
      else if (b.id === 'igo') run();
    };
  }
  function queue() { clearTimeout(imp.timer); imp.timer = setTimeout(async () => { await revalidate(); if (alive()) paint(); }, 350); }

  async function run() {
    clearTimeout(imp.timer); await revalidate();
    const list = imp.rows.filter(todo);
    if (!list.length) return paint();
    imp.running = true; paint();
    let okN = 0, failN = 0, k = 0;
    for (const r of list) {
      if (!alive()) break;
      r.state = 'importing'; paint();
      $('#igo', box).textContent = 'Importing ' + (++k) + '/' + list.length + '...';
      const res = await call('importRow', { action: r.action, account: r.account, ticker: r.ticker, date: r.date, price: r.price, qty: r.qty, name: r.name, currency: r.currency }, modeOf(r), { defaultDate: imp.defDate, deductCash: imp.deduct });
      if (res.success) { r.done = true; r.failed = false; r.state = 'done'; r.message = res.message; okN++; } else { r.failed = true; r.state = 'failed'; r.message = res.message; failN++; }
      if (alive()) paint();
    }
    imp.running = false;
    if (okN) { invalidate(); loadSymbols(); }
    if (!alive()) return;
    toast('Imported ' + okN + ' row(s)' + (failN ? ', ' + failN + ' failed (see the Status column)' : ''), failN ? 'warn' : '');
    await revalidate(); if (!alive()) return; paint();
    const failed = imp.rows.filter(r => r.state === 'failed');
    if (failed.length) $('#ifail', box).innerHTML = '<p class="muted small">Failed rows (fix them above and click Import again, or copy them):</p><textarea rows="4" style="width:100%;font:12px monospace" readonly>' +
      esc(failed.map(r => [r.account, r.ticker, r.date, r.price, r.qty, r.currency, r.name, r.message].join('\t')).join('\n')) + '</textarea>';
  }
  step1();
}

// ------------------------------------------------------------------ header / refresh
async function loadInfo() {
  const r = await call('getRefreshInfo');
  if (!r.success) return;
  state.info = r.data;
  const lu = $('#lastUpdated'), lv = document.createElement('span');          // the date and time stay together: when the line must wrap, it wraps before the date
  lu.textContent = 'Last updated: '; lv.className = 'nw'; lv.textContent = r.data.lastSuccessfulRefresh || 'never'; lu.appendChild(lv);
  $('#nextRuns').textContent = r.data.nextRuns.length ? '· next: ' + r.data.nextRuns.join(', ') : '· no hours enabled';
}
let cooldownTimer = null;
function startCooldown(sec) {
  const btn = $('#btnRefresh'), txt = $('#refreshTxt');
  clearInterval(cooldownTimer);
  let left = sec;
  btn.disabled = true;
  const tick = () => { if (left <= 0) { clearInterval(cooldownTimer); btn.disabled = false; txt.textContent = 'Refresh Now'; return; } txt.textContent = 'Wait ' + left + ' s'; left--; };
  tick(); cooldownTimer = setInterval(tick, 1000);
}
async function refreshNow() {
  const btn = $('#btnRefresh');
  btn.disabled = true; $('#refreshSpin').classList.remove('hidden'); $('#refreshTxt').textContent = 'Refreshing...';
  const r = await call('refreshNow');
  $('#refreshSpin').classList.add('hidden');
  if (r.success) { toast(r.message); invalidate(); startCooldown((state.info && state.info.cooldownSec) || 60); }
  else if (r.data && r.data.retryAfter) { toast(r.message, 'warn'); startCooldown(r.data.retryAfter); }
  else { toast(r.message, 'error'); btn.disabled = false; $('#refreshTxt').textContent = 'Refresh Now'; }
}

// ------------------------------------------------------------------ events
function selectTab(name) {
  state.tab = name;
  $$('#tabs button[data-tab]').forEach(x => x.classList.toggle('active', x.dataset.tab === name));
  const more = $('#tabMore'); if (more) more.classList.toggle('active', ['history', 'schedule', 'log'].indexOf(name) >= 0);
  $$('.tab').forEach(x => x.classList.toggle('active', x.id === 'tab-' + name));
  if (PHONE) window.scrollTo(0, 0);
  loadTab(name, false);
}
function openTabMore() {                                  // History, Schedule and Log live behind the "More" tab on phones
  const items = [['history', 'History', 'Portfolio value over time'], ['schedule', 'Schedule', 'The hours of the automatic price refresh'], ['log', 'Log', 'What the app did, and any errors']];
  const m = openModal({ title: 'More', cancelLabel: 'Close', body: '<div class="sheetlist">' + items.map(i => '<button type="button" class="sheetbtn" data-go="' + i[0] + '"><b>' + i[1] + '</b><small>' + i[2] + '</small></button>').join('') +
    '<button type="button" class="sheetbtn" id="mTheme"><b>Theme: ' + esc(THEME_TXT[getTheme()]) + '</b><small>Tap to change: Automatic, Light, Dark</small></button></div>' });
  m.addEventListener('click', e => {
    if (e.target.closest('#mTheme')) { cycleTheme(); $('#mTheme b', m).textContent = 'Theme: ' + THEME_TXT[getTheme()]; return; }
    const b = e.target.closest('[data-go]'); if (!b) return; closeModal(); selectTab(b.dataset.go);
  });
}
function openActions(tab) {                               // the toolbar buttons that do not fit on a phone, as a sheet (they keep working: we click the hidden original)
  const src = $$('.toolbar [data-more]', root(tab));
  if (!src.length) return;
  const m = openModal({ title: 'Actions', cancelLabel: 'Close', body: '<div class="sheetlist">' + src.map((b, i) => '<button type="button" class="sheetbtn' + (b.classList.contains('danger') ? ' danger' : '') + '" data-i="' + i + '"><b>' + esc(b.dataset.more) + '</b>' + (b.dataset.hint ? '<small>' + esc(b.dataset.hint) + '</small>' : '') + '</button>').join('') + '</div>' });
  m.addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (!b) return; const t = src[Number(b.dataset.i)]; closeModal(); if (t) t.click(); });
}
$('#tabs').addEventListener('click', e => {
  if (e.target.closest('#tabMore')) return openTabMore();
  const b = e.target.closest('button[data-tab]');
  if (!b) return;
  selectTab(b.dataset.tab);
});
function onPhoneChange() {
  PHONE = mq.matches; document.documentElement.classList.toggle('phone', PHONE); closeLinkMenu();
  if (state[state.tab]) render(state.tab);
}
let lastY = 0;                                            // the floating + Add button steps aside while the page scrolls down and returns on the way up
window.addEventListener('scroll', () => {
  if (!PHONE) return;
  const y = window.scrollY || 0, d = y - lastY;
  if (Math.abs(d) < 8) return;
  document.body.classList.toggle('fab-hide', d > 0 && y > 80);
  lastY = y;
}, { passive: true });
if (mq.addEventListener) mq.addEventListener('change', onPhoneChange); else if (mq.addListener) mq.addListener(onPhoneChange);
// ------------------------------------------------------------------ THEME (Automatic follows the device; Light / Dark override it on this device only)
const THEMES = ['auto', 'light', 'dark'], THEME_TXT = { auto: 'Automatic (follows your device)', light: 'Light', dark: 'Dark' };
const THEME_ICON = {
  auto: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg>',
  light: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  dark: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>'
};
let themeNow = '';
function getTheme() {
  if (themeNow) return themeNow;
  let v = ''; try { v = localStorage.getItem('theme') || ''; } catch (e) { v = ''; }
  themeNow = THEMES.indexOf(v) >= 0 ? v : 'auto';
  return themeNow;
}
function applyTheme(t) {
  themeNow = t;
  const el = document.documentElement;
  if (t === 'auto') el.removeAttribute('data-theme'); else el.setAttribute('data-theme', t);
  const b = $('#btnTheme'); if (!b) return;
  const lbl = 'Theme: ' + THEME_TXT[t] + '. Click to change.';
  b.innerHTML = THEME_ICON[t]; b.title = lbl; b.setAttribute('aria-label', lbl);
}
function cycleTheme() {
  const t = THEMES[(THEMES.indexOf(getTheme()) + 1) % THEMES.length];
  try { localStorage.setItem('theme', t); } catch (e) { /* storage may be blocked: the choice then lasts until the page is closed */ }
  applyTheme(t); toast('Theme: ' + THEME_TXT[t]);
}
applyTheme(getTheme());
$('#btnTheme').addEventListener('click', cycleTheme);
$('#btnRefresh').addEventListener('click', refreshNow);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

const fillers = { owned: fillOwned, watch: fillWatch, sold: fillSold, log: fillLog };
const fullRender = { owned: renderOwned, sold: renderSold };
$$('main section').forEach(sec => {
  const tab = sec.id.replace('tab-', '');
  sec.addEventListener('input', e => {
    const id = e.target.id;
    if (tab === 'history' && (id === 'f-haccount' || id === 'f-hrange')) { if (id === 'f-haccount') ui.history.account = e.target.value; else ui.history.range = e.target.value; return renderHistory(); }
    if (!fillers[tab]) return;
    if (id === 'f-account' || id === 'f-year') { ui[tab][id === 'f-account' ? 'account' : 'year'] = e.target.value; return fullRender[tab](); }
    if (id === 'f-q') ui[tab].q = e.target.value;
    else if (id === 'f-market') ui[tab].market = e.target.value;
    else if (id === 'f-status') ui[tab].status = e.target.value;
    else if (id === 'f-sort') { ui[tab].sort = e.target.value; delete colSort[tab]; saveView(tab); }
    else return;
    fillers[tab]();
    syncFilters(tab);
  });
  sec.addEventListener('click', async e => {
    if (e.target.closest('.rz')) return;
    const th = e.target.closest('th.sortable');
    if (th && fillers[tab]) {
      if (Date.now() - lastResize < 300) return;                // the click that ends a column drag is not a sort
      const k = th.dataset.sort, c = colSort[tab];
      colSort[tab] = { key: k, dir: c && c.key === k ? -c.dir : 1 };
      saveView(tab);
      return fillers[tab]();
    }
    const a = e.target.closest('[data-act]');
    if (!a) return;
    e.stopPropagation();
    const t = a.dataset.t, ac = a.dataset.a, act = a.dataset.act;
    if (act === 'reload') return loadTab(tab, true);
    if (act === 'filters') { phoneUi.filters[tab] = !phoneUi.filters[tab]; $('.toolbar', sec).classList.toggle('fopen', phoneUi.filters[tab]); return; }
    if (act === 'more') return openActions(tab);
    if (act === 'add') return openAdd(tab);
    if (act === 'sell') return openSell(t, ac);
    if (act === 'links') return openLinkMenu(a);
    if (act === 'note') return openNote(a.dataset.k, t, ac, a.dataset.s);
    if (act === 'tkfilter') { Object.assign(ui.owned, { tk: t, account: '', market: '', q: '' }); return renderOwned(); }       // all positions of this ticker, whatever filters were set
    if (act === 'tkclear') { ui.owned.tk = ''; return renderOwned(); }
    if (act === 'cols') return openColumns(tab);
    if (act === 'setCash') return openSetCash(ac);
    if (act === 'adjCash') return openAdjustCash(ac);
    if (act === 'cashLog') return openCashLog(ac);
    if (act === 'edit') return openEdit(t, ac);
    if (act === 'toggle') { const k = t + '\u241F' + ac; ui.owned.open[k] = !ui.owned.open[k]; return PHONE ? fillOwned() : renderOwned(); }
    if (act === 'toggleAll') { const scope = ui.owned.account ? state.owned.rows.filter(r => r.account === ui.owned.account) : state.owned.rows, openAll = !(scope.length && scope.every(r => ui.owned.open[rowKey(r)])); scope.forEach(r => { ui.owned.open[rowKey(r)] = openAll; }); return renderOwned(); }
    if (act === 'sellLot') return openSell(t, ac, a.dataset.l);
    if (act === 'editLot') return openEditLot(t, ac, a.dataset.l);
    if (act === 'delLot') {
      const pr = state.owned.rows.find(x => x.ticker === t && x.account === ac), lastNote = pr && pr.lotCount === 1 && pr.note ? ' This is the only lot, so the position\'s note is deleted too.' : '';
      if (await confirmModal('Delete this lot?', 'This removes one purchase of <b>' + esc(t) + '</b> (' + esc(ac) + ') without creating a Sold record. Use it for data-entry mistakes; to record a sale use Sell this lot.' + lastNote, 'Delete', true)) mutate(call('deleteLot', a.dataset.l));
      return;
    }
    if (act === 'import') return openImport();
    if (act === 'ioMenu') return $('.iomenu') ? closeLinkMenu() : openIoMenu(a);
    if (act === 'export') return openExport(tab === 'sold' ? 'sold' : 'owned');
    if (act === 'recordHistory') return mutate(call('recordHistoryNow'));
    if (act === 'addAcc') return openAccountName('Add account', '', n => call('addAccount', n));
    if (act === 'renameAcc') return openAccountName('Rename account', ac, n => call('renameAccount', ac, n));
    if (act === 'delAcc') { if (await confirmModal('Delete account?', 'Delete the unused account <b>' + esc(ac) + '</b>?', 'Delete', true)) mutate(call('deleteAccount', ac)); return; }
    if (act === 'wrow') return openWatchRow(t);
    if (act === 'del') {
      const pr = tab === 'owned' ? state.owned.rows.find(x => x.ticker === t && x.account === ac) : null;
      const wr = tab === 'owned' ? null : state.watch.rows.find(x => x.ticker === t), hasNote = tab === 'owned' ? !!(pr && pr.note) : !!(wr && wr.note);
      const label = (tab === 'owned' ? 'This removes the whole position (' + ac + (pr ? ', ' + pr.lotCount + ' lot' + (pr.lotCount === 1 ? '' : 's') : '') + ') without creating a Sold record. Use it for data-entry mistakes; to record a sale, click the row instead.' : 'Remove this row from the Watchlist?') + (hasNote ? ' Its note is deleted too.' : '');
      if (await confirmModal('Delete ' + t + '?', esc(label), 'Delete', true)) mutate(tab === 'owned' ? call('deleteOwnedRow', t, ac) : call('deleteWatchlistRow', t));
      return;
    }
    if (act === 'sw') return mutate(call('addSoldToWatchlist', t));
    if (act === 'removePaused') { if (await confirmModal('Remove all Paused?', 'All Paused Watchlist rows will be deleted, with their notes.', 'Remove', true)) mutate(call('removeAllPaused')); return; }
    if (act === 'saveSched') {
      const hours = $$('.hr', sec).map(c => ({ hour: Number(c.dataset.h), run: c.checked }));
      const r = await call('saveSchedule', { weekdaysOnly: $('#wk', sec).checked, hours });
      if (r.success) { toast('Schedule saved'); state.schedule = r.data; loadInfo(); } else toast(r.message, 'error');
      return;
    }
    if (act === 'clearLog') { if (await confirmModal('Clear Log?', 'All log rows will be deleted (the header stays).', 'Clear', true)) mutate(call('clearLog')); return; }
    if (act === 'archive') {
      const y = new Date().getMonth() === 0 ? new Date().getFullYear() - 1 : new Date().getFullYear();
      openModal({
        title: 'Archive year', body: '<p>Copies this whole spreadsheet to <b>Investment_YYYY</b>, then clears <b>Sold</b> and <b>Log</b> to start a fresh year. Owned and Watchlist are kept.</p><div class="field"><label>Year</label><input id="yr" type="number" value="' + y + '"></div>',
        submit: 'Archive', onSubmit: async m => {
          const r = await call('archiveYear', Number($('#yr', m).value));
          if (r.success) { toast(r.message); invalidate(); return true; }
          setErr(m, r.message); return false;
        }
      });
    }
  });
});

// ------------------------------------------------------------------ start
(async () => {
  await Promise.race([loadPrefs(), new Promise(r => setTimeout(r, 1500))]);      // saved column widths first, so the first draw already uses them
  loadTab('owned', true); loadInfo(); loadSymbols();
})();
})();
</script>
